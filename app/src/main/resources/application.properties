spring.application.name=discount-market-platform
spring.profiles.default=local

app.cors.allowed-origins=http://localhost:5173

scrapers.base-dir=${SCRAPERS_BASE_DIR:${user.dir}/..}
scrapers.output-dir=/tmp/discount-market-scrapes
scrapers.scrapy.executable=scrapy
# Full crawl default. Local profile/script override this to 1 for quick tests.
scrapers.scrapy.max-pages=1000
scrapers.scheduler.fixed-delay-ms=60000
scrapers.scheduler.max-parallel-runs=${SCRAPERS_SCHEDULER_MAX_PARALLEL_RUNS:3}
