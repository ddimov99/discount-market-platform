spring.datasource.url=jdbc:postgresql://localhost:5432/discount_market
spring.datasource.username=discount_app
spring.datasource.password=discount_app_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

scrapers.scrapy.max-pages=1
scrapers.scrapy.executable=${SCRAPY_EXECUTABLE:${scrapers.base-dir}/ozone_discount_scraper/.venv/bin/scrapy}
# Only on/off lives here. Spider URLs, arguments, intervals, and timeouts stay in scraper_configs.
scrapers.spiders.[ozone-discounts].enabled=${SCRAPERS_OZONE_DISCOUNTS_ENABLED:true}
scrapers.spiders.[technomarket-products].enabled=${SCRAPERS_TECHNOMARKET_PRODUCTS_ENABLED:false}
scrapers.spiders.[technopolis-products].enabled=${SCRAPERS_TECHNOPOLIS_PRODUCTS_ENABLED:false}
scrapers.spiders.[ardes-products].enabled=${SCRAPERS_ARDES_PRODUCTS_ENABLED:true}
