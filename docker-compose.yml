name: discount-market-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: discount-market-postgres
    environment:
      POSTGRES_DB: discount_market
      POSTGRES_USER: discount_app
      POSTGRES_PASSWORD: discount_app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discount_app -d discount_market"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
